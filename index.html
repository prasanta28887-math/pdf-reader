<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madhyamik PYQ — Advanced PDF Library & Reader</title>

  <!-- PDF.js 3.11.174 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-app: #0f1117;
      --bg-toolbar: #161922;
      --bg-sidebar: #13161f;
      --bg-card: #1c202d;
      --bg-hover: #262b3d;
      --border: #2a3042;
      --text-main: #eef1f8;
      --text-muted: #9aa3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --folder-color: #f59e0b;
      --pdf-color: #ef4444;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --toolbar-h: 54px;
      --sidebar-w: 295px;
    }

    [data-theme="light"] {
      --bg-app: #eef1f6;
      --bg-toolbar: #ffffff;
      --bg-sidebar: #f8fafc;
      --bg-card: #ffffff;
      --bg-hover: #eef2f7;
      --border: #d8dee9;
      --text-main: #111827;
      --text-muted: #6b7280;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    [data-theme="sepia"] {
      --bg-app: #e7dec8;
      --bg-toolbar: #f4ecd8;
      --bg-sidebar: #efe5ce;
      --bg-card: #faf4e6;
      --bg-hover: #e5d8bc;
      --border: #d3c4a3;
      --text-main: #3b2f1e;
      --text-muted: #78654b;
      --accent: #b45309;
      --accent-hover: #92400e;
      --shadow: 0 8px 24px rgba(59, 47, 30, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
    }

    #reading-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      z-index: 1000;
      transition: width 0.15s ease;
    }

    /* Toolbar */
    .toolbar {
      height: var(--toolbar-h);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 6px;
      position: relative;
      z-index: 50;
      user-select: none;
    }
    .toolbar-group { display: flex; align-items: center; gap: 4px; min-width: 0; }

    .brand {
      font-weight: 700; font-size: 14px;
      display: flex; align-items: center; gap: 6px;
      padding: 0 6px; white-space: nowrap; cursor: pointer;
    }
    .brand span {
      background: var(--accent); color: #fff;
      font-size: 10px; padding: 2px 5px; border-radius: 4px;
    }
    .divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      height: 34px; min-width: 34px; padding: 0 8px;
      border-radius: 7px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn.active { background: rgba(99, 102, 241, 0.18); color: var(--accent); border-color: rgba(99, 102, 241, 0.35); }
    .btn-outline { border-color: var(--border); background: var(--bg-card); }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 600; padding: 0 12px; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn svg { width: 17px; height: 17px; flex-shrink: 0; }

    .page-nav {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 7px; padding: 2px 6px; height: 34px; font-size: 13px;
    }
    .page-nav input {
      width: 42px; background: transparent; border: none;
      color: var(--text-main); text-align: center; font-size: 13px; font-weight: 600; outline: none;
    }
    .page-nav span { color: var(--text-muted); }

    select.tb-select {
      height: 34px; background: var(--bg-card); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 0 8px; font-size: 12.5px; outline: none; cursor: pointer;
    }

    /* Hide PDF-specific toolbar controls while browsing library */
    body.mode-library .pdf-only { display: none !important; }
    body.embed-mode .hide-in-embed { display: none !important; }
    body.no-download .download-only { display: none !important; }
    body.single-embed .library-only { display: none !important; }

    /* Workspace */
    .workspace { display: flex; height: calc(100vh - var(--toolbar-h)); position: relative; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: margin-left 0.22s ease;
      z-index: 40;
    }
    .sidebar.collapsed { margin-left: calc(var(--sidebar-w) * -1); }

    .sidebar-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      padding: 6px; gap: 3px;
    }
    .sidebar-tab {
      flex: 1; background: transparent; border: none;
      color: var(--text-muted); padding: 7px 3px;
      border-radius: 6px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .sidebar-tab.active { background: var(--bg-hover); color: var(--text-main); }

    .sidebar-panel { flex: 1; overflow-y: auto; padding: 10px; display: none; }
    .sidebar-panel.active { display: block; }

    /* Sidebar Mini Library */
    .sb-search {
      width: 100%; height: 34px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 7px; padding: 0 10px;
      color: var(--text-main); font-size: 12.5px; outline: none;
      margin-bottom: 10px;
    }
    .sb-search:focus { border-color: var(--accent); }
    .sb-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 9px; border-radius: 7px; cursor: pointer;
      font-size: 12.5px; line-height: 1.35; margin-bottom: 4px;
      border: 1px solid transparent; word-break: break-word;
    }
    .sb-item:hover { background: var(--bg-hover); }
    .sb-item.active { background: rgba(99, 102, 241, 0.16); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .sb-folder-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      color: var(--text-muted); margin: 10px 4px 5px; letter-spacing: 0.4px;
    }

    /* Main Viewer / Library Container */
    .viewer-container {
      flex: 1; overflow: auto; position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 60px; scroll-behavior: smooth;
    }

    /* Full Library Explorer View */
    .library-view {
      width: 100%; max-width: 1040px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .lib-header {
      background: var(--bg-toolbar);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--shadow);
    }
    .lib-top-row {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .lib-top-row h1 { font-size: 19px; display: flex; align-items: center; gap: 8px; }
    .lib-search-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .lib-search-row input {
      flex: 1; min-width: 220px; height: 40px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 9px; padding: 0 14px; color: var(--text-main);
      font-size: 13.5px; outline: none;
    }
    .lib-search-row input:focus { border-color: var(--accent); }

    .breadcrumbs {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      font-size: 13px; color: var(--text-muted);
    }
    .crumb {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 99px; cursor: pointer;
      color: var(--text-main); font-weight: 500;
    }
    .crumb:hover { border-color: var(--accent); color: var(--accent); }
    .crumb.current { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }

    .lib-section-title {
      font-size: 12.5px; font-weight: 700; text-transform: uppercase;
      color: var(--text-muted); letter-spacing: 0.6px; margin-top: 4px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--bg-toolbar);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: flex-start; gap: 11px; }
    .card-icon {
      width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
    }
    .card-icon.folder { background: rgba(245, 158, 11, 0.15); color: var(--folder-color); }
    .card-icon.pdf { background: rgba(239, 68, 68, 0.15); color: var(--pdf-color); }
    .card-title { font-size: 14px; font-weight: 600; line-height: 1.35; word-break: break-word; }
    .card-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; word-break: break-word; }
    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted);
    }
    .card-actions { display: flex; gap: 4px; }
    .mini-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-main); font-size: 11.5px; padding: 4px 8px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Thumbnails, Outline, Bookmarks */
    .thumb-card {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 8px; margin-bottom: 10px; border-radius: 8px;
      cursor: pointer; border: 2px solid transparent; background: var(--bg-card);
    }
    .thumb-card:hover { border-color: var(--border); }
    .thumb-card.active { border-color: var(--accent); }
    .thumb-card canvas { max-width: 100%; height: auto; border-radius: 4px; background: #fff; }
    .thumb-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }

    .outline-item { padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; line-height: 1.35; }
    .outline-item:hover { background: var(--bg-hover); color: var(--accent); }

    .note-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .note-box textarea {
      width: 100%; min-height: 68px; resize: vertical;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px; color: var(--text-main); font-size: 12.5px; font-family: inherit; outline: none;
    }
    .bookmark-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; font-size: 12.5px; }
    .bookmark-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .bookmark-link { color: var(--accent); font-weight: 700; cursor: pointer; }
    .bookmark-del { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .bookmark-del:hover { color: var(--danger); }

    /* PDF Pages */
    #pages-wrapper { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
    #pages-wrapper.view-book { display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: 16px; }
    #pages-wrapper.view-single .page-shell { display: none; }
    #pages-wrapper.view-single .page-shell.current-single { display: block; }

    .page-shell { position: relative; background: #fff; box-shadow: var(--shadow); border-radius: 4px; overflow: hidden; }
    .page-shell canvas { display: block; }
    .page-badge {
      position: absolute; bottom: 8px; right: 10px;
      background: rgba(0,0,0,0.55); color: #fff; font-size: 11px;
      padding: 2px 7px; border-radius: 99px; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.2s;
    }
    .page-shell:hover .page-badge { opacity: 1; }

    body.pdf-dark-mode .page-shell canvas { filter: invert(0.9) hue-rotate(180deg) contrast(0.95); }
    body.pdf-dark-mode .page-shell { background: #1a1a1a; }

    .textLayer { opacity: 1; line-height: 1; }
    .textLayer span::selection { background: rgba(99, 102, 241, 0.35); }
    .textLayer .search-highlight { background: rgba(250, 204, 21, 0.55) !important; color: transparent !important; border-radius: 2px; }
    .textLayer .search-highlight.current-match { background: rgba(249, 115, 22, 0.72) !important; outline: 2px solid #f97316; }

    /* Floating Search Bar */
    .search-bar {
      position: fixed; top: calc(var(--toolbar-h) + 10px); right: 16px;
      background: var(--bg-toolbar); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow); padding: 8px;
      display: none; flex-direction: column; gap: 8px;
      width: 340px; max-width: calc(100vw - 32px); z-index: 80;
    }
    .search-bar.open { display: flex; }
    .search-row { display: flex; align-items: center; gap: 6px; }
    .search-row input {
      flex: 1; height: 34px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 0 10px; color: var(--text-main); font-size: 13px; outline: none;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .search-results-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .search-item {
      padding: 7px 9px; border-radius: 6px; background: var(--bg-card);
      cursor: pointer; font-size: 12px; line-height: 1.4; border: 1px solid transparent;
    }
    .search-item:hover, .search-item.active { border-color: var(--accent); background: var(--bg-hover); }
    .search-item mark { background: #facc15; color: #000; padding: 0 2px; border-radius: 2px; }

    /* TTS Bar */
    .tts-bar {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--bg-toolbar); border: 1px solid var(--border);
      box-shadow: var(--shadow); border-radius: 999px; padding: 6px 14px;
      display: none; align-items: center; gap: 8px; z-index: 85; font-size: 12.5px;
    }
    .tts-bar.open { display: flex; }

    /* Loader */
    .loader-overlay {
      position: fixed; inset: 0; background: rgba(15, 17, 23, 0.72);
      backdrop-filter: blur(4px); display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 200; color: #fff;
    }
    .loader-overlay.show { display: flex; }
    .spinner {
      width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.18);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(3px); display: none; align-items: center;
      justify-content: center; padding: 16px; z-index: 300;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-toolbar); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 610px;
      max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); padding: 22px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: 17px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-field label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-field input, .form-field select, .form-field textarea {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px; color: var(--text-main);
      font-size: 13px; outline: none; font-family: inherit;
    }
    .form-field textarea.code-out {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; min-height: 118px; resize: vertical;
    }
    .check-row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; font-size: 13px; }
    .check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--bg-card);
      color: var(--text-main); border: 1px solid var(--accent);
      padding: 10px 16px; border-radius: 9px; box-shadow: var(--shadow);
      font-size: 13px; z-index: 400; opacity: 0; transform: translateY(10px);
      transition: all 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 860px) {
      .hide-sm { display: none !important; }
      .sidebar { position: fixed; top: var(--toolbar-h); bottom: 0; left: 0; box-shadow: var(--shadow); }
      #pages-wrapper.view-book { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media print {
      .toolbar, .sidebar, .search-bar, .tts-bar, #reading-progress { display: none !important; }
      .workspace, .viewer-container { height: auto !important; overflow: visible !important; padding: 0 !important; }
      .page-shell { box-shadow: none !important; page-break-after: always; }
    }
  </style>
</head>
<body class="mode-library">
  <div id="reading-progress"></div>

  <!-- Top Toolbar -->
  <header class="toolbar">
    <div class="toolbar-group">
      <button class="btn" id="btn-sidebar" title="Toggle Sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <div class="brand" id="btn-home" title="Back to PDF Library">
        Madhyamik PYQ <span>PDF</span>
      </div>
      <button class="btn btn-outline pdf-only library-only" id="btn-back-lib" title="Back to Folder Library">
        ← Library
      </button>
      <button class="btn hide-in-embed hide-sm" id="btn-open-modal" title="Load Any External GitHub PDF or Local File">
        + Custom PDF
      </button>
    </div>

    <!-- Center PDF Controls (Shown when reading a PDF) -->
    <div class="toolbar-group pdf-only">
      <button class="btn" id="btn-prev" title="Previous Page (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="page-nav">
        <input type="number" id="page-input" value="1" min="1" aria-label="Page" />
        <span>/ <b id="page-count">0</b></span>
      </div>
      <button class="btn" id="btn-next" title="Next Page (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <div class="divider"></div>

      <button class="btn" id="btn-zoom-out" title="Zoom Out (-)">−</button>
      <select class="tb-select" id="zoom-select" title="Zoom">
        <option value="fit-width" selected>Fit Width</option>
        <option value="fit-page">Fit Page</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="2.5">250%</option>
      </select>
      <button class="btn" id="btn-zoom-in" title="Zoom In (+)">+</button>
    </div>

    <!-- Right Tools -->
    <div class="toolbar-group">
      <button class="btn pdf-only" id="btn-search" title="Search Inside PDF (Ctrl+F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <select class="tb-select pdf-only hide-sm" id="view-mode" title="Layout Mode">
        <option value="continuous">Scroll</option>
        <option value="single">Single</option>
        <option value="book">Book</option>
      </select>
      <button class="btn pdf-only hide-sm" id="btn-rotate" title="Rotate 90° (R)">⟳</button>
      <button class="btn pdf-only" id="btn-pdf-dark" title="Night Mode for PDF Pages">🌙</button>
      <select class="tb-select hide-sm" id="theme-select" title="UI Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="sepia">Sepia</option>
      </select>
      <button class="btn pdf-only hide-sm" id="btn-tts" title="Read Aloud">🔊</button>
      <button class="btn pdf-only" id="btn-bookmark" title="Bookmark Page (B)">🔖</button>
      <button class="btn pdf-only download-only" id="btn-download" title="Download PDF">⬇</button>
      <button class="btn" id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
      <button class="btn btn-primary hide-in-embed" id="btn-embed-modal" title="Generate Blogger Embed Code">
        &lt;/&gt; <span class="hide-sm">Blogger Embed</span>
      </button>
    </div>

  <div class="toast" id="toast"></div>

  <script>
    // =========================================================================
    // REPOSITORY CONFIG (Pre-configured for your GitHub Repo!)
    // =========================================================================
    const REPO = {
      owner: 'prasanta28887-math',
      name: 'madhyamik-pyq-pdf',
      branch: 'main',
      readerBase: 'https://prasanta28887-math.github.io/madhyamik-pyq-pdf/'
    };

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const $ = (id) => document.getElementById(id);
    const viewerContainer = $('viewer-container');
    const pagesWrapper = $('pages-wrapper');

    const state = {
      // Repo library state
      allFiles: [],         // [{ path, name, folder, size }]
      currentFolder: '',    // '' = root, or 'english_medium/maths_with_watermark'
      lockedRootFolder: '', // when embedded with ?folder=...

      // PDF reader state
      pdfDoc: null,
      currentPath: '',      // repo-relative path if loaded from repo
      resolvedUrl: '',
      fallbackUrl: '',
      docKey: '',
      currentPage: 1,
      numPages: 0,
      scale: 1.25,
      zoomMode: 'fit-width',
      rotation: 0,
      viewMode: 'continuous',
      pageObserver: null,
      thumbObserver: null,
      renderedPages: new Set(),
      renderedThumbs: new Set(),
      renderTasks: new Map(),
      pageTexts: [],
      searchQuery: '',
      searchMatches: [],
      activeMatchIdx: -1,
      ttsActive: false
    };

    // Utilities
    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function prettyName(raw) {
      return raw
        .replace(/\.pdf$/i, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function encodePath(path) {
      return path.split('/').map(encodeURIComponent).join('/');
    }

    function repoUrlsForPath(relPath) {
      const clean = relPath.replace(/^\/+/, '');
      const enc = encodePath(clean);
      return {
        cdn: `https://cdn.jsdelivr.net/gh/${REPO.owner}/${REPO.name}@${REPO.branch}/${enc}`,
        raw: `https://raw.githubusercontent.com/${REPO.owner}/${REPO.name}/${REPO.branch}/${enc}`
      };
    }

    function normalizePdfInput(input) {
      input = (input || '').trim();
      if (!input) return { primary: '', fallback: '', relPath: '' };

      // Check if it's a GitHub blob URL
      const blob = input.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/);
      if (blob) {
        const [, u, r, b, p] = blob;
        const rel = (u === REPO.owner && r === REPO.name) ? decodeURIComponent(p) : '';
        return {
          primary: `https://cdn.jsdelivr.net/gh/${u}/${r}@${b}/${p}`,
          fallback: `https://raw.githubusercontent.com/${u}/${r}/${b}/${p}`,
          relPath: rel
        };
      }
      // Check if it's already an HTTP URL
      if (/^https?:\/\//i.test(input)) {
        const rawMatch = input.match(/^https?:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)$/);
        if (rawMatch) {
          const [, u, r, b, p] = rawMatch;
          return {
            primary: `https://cdn.jsdelivr.net/gh/${u}/${r}@${b}/${p}`,
            fallback: input,
            relPath: (u === REPO.owner && r === REPO.name) ? decodeURIComponent(p) : ''
          };
        }
        return { primary: input, fallback: '', relPath: '' };
      }
      // Otherwise treat as relative path inside this repo
      const urls = repoUrlsForPath(input);
      return { primary: urls.cdn, fallback: urls.raw, relPath: input.replace(/^\/+/, '') };
    }

    function setLoading(show, text = 'Loading...') {
      $('loader-text').textContent = text;
      $('loader').classList.toggle('show', show);
    }

    // =========================================================================
    // AUTO GITHUB REPO FOLDER & SUBFOLDER DISCOVERY
    // =========================================================================
    async function fetchRepoTree(forceRefresh = false) {
      const cacheKey = `repo_tree_${REPO.owner}_${REPO.name}_${REPO.branch}`;
      if (!forceRefresh) {
        try {
          const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
          if (cached && Date.now() - cached.time < 10 * 60 * 1000 && cached.files?.length) {
            state.allFiles = cached.files;
            renderLibrary();
            renderSidebarFiles();
            return;
          }
        } catch {}
      }

      let pdfFiles = [];

      // 1) Primary: GitHub Git Trees API (recursive — finds ALL nested folders/subfolders)
      try {
        const res = await fetch(
          `https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/trees/${REPO.branch}?recursive=1`
        );
        if (res.ok) {
          const data = await res.json();
          pdfFiles = (data.tree || [])
            .filter((item) => item.type === 'blob' && /\.pdf$/i.test(item.path))
            .map((item) => {
              const parts = item.path.split('/');
              const name = parts.pop();
              return { path: item.path, name, folder: parts.join('/'), size: item.size || 0 };
            });
        }
      } catch {}

      // 2) Backup: jsDelivr Data API (no GitHub API rate-limit!)
      if (!pdfFiles.length) {
        try {
          const res = await fetch(
            `https://data.jsdelivr.com/v1/packages/gh/${REPO.owner}/${REPO.name}@${REPO.branch}?structure=flat`
          );
          if (res.ok) {
            const data = await res.json();
            pdfFiles = (data.files || [])
              .filter((f) => /\.pdf$/i.test(f.name))
              .map((f) => {
                const clean = f.name.replace(/^\/+/, '');
                const parts = clean.split('/');
                const name = parts.pop();
                return { path: clean, name, folder: parts.join('/'), size: f.size || 0 };
              });
          }
        } catch {}
      }

      pdfFiles.sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));
      state.allFiles = pdfFiles;

      if (pdfFiles.length) {
        try {
          sessionStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), files: pdfFiles }));
        } catch {}
      }

      renderLibrary();
      renderSidebarFiles();
    }

    // Switch between Library View and PDF Reader View
    function showLibraryView(folderPath = state.currentFolder) {
      stopTTS();
      state.currentFolder = folderPath;
      document.body.classList.add('mode-library');
      $('library-view').style.display = 'flex';
      pagesWrapper.style.display = 'none';
      $('search-bar').classList.remove('open');
      $('reading-progress').style.width = '0%';
      renderLibrary();
    }

    function showReaderView() {
      document.body.classList.remove('mode-library');
      $('library-view').style.display = 'none';
      pagesWrapper.style.display = 'flex';
    }

    // Render Breadcrumbs + Subfolders + PDFs inside currentFolder
    function renderLibrary() {
      const query = ($('lib-search-input').value || '').trim().toLowerCase();
      const rootLock = state.lockedRootFolder;
      const cur = state.currentFolder || '';

      // Title
      $('lib-title').textContent = cur
        ? prettyName(cur.split('/').pop())
        : 'Madhyamik PYQ PDF Library';

      // Breadcrumbs
      const bc = $('breadcrumbs');
      bc.innerHTML = '';
      const addCrumb = (label, path, isCurrent) => {
        const el = document.createElement('span');
        el.className = 'crumb' + (isCurrent ? ' current' : '');
        el.textContent = label;
        if (!isCurrent) el.onclick = () => { $('lib-search-input').value = ''; showLibraryView(path); };
        bc.appendChild(el);
      };

      if (!rootLock) addCrumb('🏠 All Subjects', '', cur === '' && !query);
      else addCrumb('📁 ' + prettyName(rootLock.split('/').pop()), rootLock, cur === rootLock && !query);

      if (cur && cur !== rootLock) {
        const basePrefix = rootLock ? rootLock + '/' : '';
        const rel = cur.startsWith(basePrefix) ? cur.slice(basePrefix.length) : cur;
        const segs = rel.split('/').filter(Boolean);
        let acc = rootLock;
        segs.forEach((seg, idx) => {
          acc = acc ? `${acc}/${seg}` : seg;
          const sep = document.createElement('span');
          sep.textContent = '›';
          bc.appendChild(sep);
          addCrumb(prettyName(seg), acc, idx === segs.length - 1 && !query);
        });
      }

      const content = $('lib-content');
      if (!state.allFiles.length) {
        content.innerHTML = `<p style="color:var(--text-muted);text-align:center;padding:30px;">No PDF files found in <b>${REPO.owner}/${REPO.name}</b>. Click Refresh or verify the repo is Public.</p>`;
        return;
      }

      // Filter scope (respect lockedRootFolder if set)
      const scopedFiles = rootLock
        ? state.allFiles.filter((f) => f.folder === rootLock || f.folder.startsWith(rootLock + '/'))
        : state.allFiles;

      // Global Search Mode
      if (query) {
        const matches = scopedFiles.filter(
          (f) => f.path.toLowerCase().includes(query) || prettyName(f.name).toLowerCase().includes(query)
        );
        if (!matches.length) {
          content.innerHTML = `<p style="color:var(--text-muted);text-align:center;padding:30px;">No PDFs matching "<b>${escapeHtml(query)}</b>".</p>`;
          return;
        }
        content.innerHTML = `<div class="lib-section-title">Search Results (${matches.length} PDFs)</div><div class="grid-cards" id="grid-pdfs"></div>`;
        const grid = $('grid-pdfs');
        matches.forEach((f) => grid.appendChild(createPdfCard(f, true)));
        return;
      }

      // Folder View: Find direct child subfolders & direct PDFs
      const folderCounts = new Map();
      const directPdfs = [];
      const prefix = cur ? cur + '/' : '';

      scopedFiles.forEach((f) => {
        if (f.folder === cur) {
          directPdfs.push(f);
        } else if (cur === '' || f.folder.startsWith(prefix)) {
          const rest = cur ? f.folder.slice(prefix.length) : f.folder;
          const nextFolder = rest.split('/')[0];
          if (nextFolder) {
            const fullSub = cur ? `${cur}/${nextFolder}` : nextFolder;
            folderCounts.set(fullSub, (folderCounts.get(fullSub) || 0) + 1);
          }
        }
      });

      content.innerHTML = '';

      // Render Subfolders
      if (folderCounts.size) {
        const title = document.createElement('div');
        title.className = 'lib-section-title';
        title.textContent = `Folders (${folderCounts.size})`;
        content.appendChild(title);

        const fGrid = document.createElement('div');
        fGrid.className = 'grid-cards';
        fGrid.style.margin = '10px 0 22px';

        [...folderCounts.entries()]
          .sort((a, b) => a[0].localeCompare(b[0]))
          .forEach(([subPath, count]) => {
            const segName = subPath.split('/').pop();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="card-head">
                <div class="card-icon folder">📁</div>
                <div>
                  <div class="card-title">${escapeHtml(prettyName(segName))}</div>
                  <div class="card-sub">${count} PDF${count > 1 ? 's' : ''} inside</div>
                </div>
              </div>
              <div class="card-footer">
                <span>Open folder →</span>
                <div class="card-actions hide-in-embed">
                  <button class="mini-btn" data-embed-folder="${escapeHtml(subPath)}" title="Get Blogger Embed Code for this Folder">&lt;/&gt; Embed</button>
                </div>
              </div>
            `;
            card.onclick = (e) => {
              const embBtn = e.target.closest('[data-embed-folder]');
              if (embBtn) {
                e.stopPropagation();
                openEmbedModal('folder', embBtn.dataset.embedFolder);
                return;
              }
              showLibraryView(subPath);
            };
            fGrid.appendChild(card);
          });
        content.appendChild(fGrid);
      }

      // Render Direct PDFs
      if (directPdfs.length) {
        const title = document.createElement('div');
        title.className = 'lib-section-title';
        title.textContent = `PDF Question Papers (${directPdfs.length})`;
        content.appendChild(title);

        const pGrid = document.createElement('div');
        pGrid.className = 'grid-cards';
        pGrid.style.marginTop = '10px';
        directPdfs.forEach((f) => pGrid.appendChild(createPdfCard(f, false)));
        content.appendChild(pGrid);
      }
    }

    function createPdfCard(file, showFolderSub) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div class="card-icon pdf">📄</div>
          <div>
            <div class="card-title">${escapeHtml(prettyName(file.name))}</div>
            ${showFolderSub && file.folder ? `<div class="card-sub">📁 ${escapeHtml(file.folder.split('/').map(prettyName).join(' › '))}</div>` : ''}
          </div>
        </div>
        <div class="card-footer">
          <span>${formatSize(file.size) || 'PDF Document'}</span>
          <div class="card-actions">
            <button class="mini-btn hide-in-embed" data-embed-pdf="${escapeHtml(file.path)}" title="Blogger Embed Code">&lt;/&gt; Embed</button>
            <button class="mini-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);">Read</button>
          </div>
        </div>
      `;
      card.onclick = (e) => {
        const embBtn = e.target.closest('[data-embed-pdf]');
        if (embBtn) {
          e.stopPropagation();
          openEmbedModal('pdf', embBtn.dataset.embedPdf);
          return;
        }
        loadPDF(file.path);
      };
      return card;
    }

    // Sidebar Quick File List
    function renderSidebarFiles() {
      const box = $('sb-file-list');
      const q = ($('sb-file-search').value || '').trim().toLowerCase();
      const rootLock = state.lockedRootFolder;
      const list = state.allFiles.filter((f) => {
        if (rootLock && f.folder !== rootLock && !f.folder.startsWith(rootLock + '/')) return false;
        return !q || f.path.toLowerCase().includes(q) || prettyName(f.name).toLowerCase().includes(q);
      });

      if (!list.length) {
        box.innerHTML = '<p style="color:var(--text-muted);font-size:12.5px;">No matching PDFs.</p>';
        return;
      }

      // Group by folder
      const groups = new Map();
      list.forEach((f) => {
        const g = f.folder || 'Root';
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(f);
      });

      box.innerHTML = '';
      [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([folder, files]) => {
        const h = document.createElement('div');
        h.className = 'sb-folder-title';
        h.textContent = '📁 ' + folder.split('/').map(prettyName).join(' › ');
        box.appendChild(h);

        files.forEach((f) => {
          const item = document.createElement('div');
          item.className = 'sb-item' + (state.currentPath === f.path ? ' active' : '');
          item.innerHTML = `<span>📄</span><span>${escapeHtml(prettyName(f.name))}</span>`;
          item.onclick = () => loadPDF(f.path);
          box.appendChild(item);
        });
      });
    }

    // =========================================================================
    // PDF ENGINE (HiDPI, Lazy Rendering, Text Layer, Search, Bookmarks, TTS)
    // =========================================================================
    async function loadPDF(source, options = {}) {
      const { displayName = '', startPage = null } = options;
      setLoading(true, 'Opening PDF...');

      try {
        state.renderTasks.forEach((t) => { try { t.cancel(); } catch {} });
        state.renderTasks.clear();
        state.renderedPages.clear();
        state.renderedThumbs.clear();
        state.pageTexts = [];
        stopTTS();

        let pdfDoc;
        if (typeof source === 'string') {
          const info = normalizePdfInput(source);
          state.currentPath = info.relPath;
          state.resolvedUrl = info.primary;
          state.fallbackUrl = info.fallback;
          state.docKey = 'mpyq_' + btoa(unescape(encodeURIComponent(info.relPath || info.primary))).slice(0, 48);

          const loadUrl = async (url) => {
            const task = pdfjsLib.getDocument({
              url,
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true
            });
            task.onProgress = (p) => {
              if (p.total) $('loader-text').textContent = `Loading PDF... ${Math.min(100, Math.round((p.loaded / p.total) * 100))}%`;
            };
            return task.promise;
          };

          try {
            pdfDoc = await loadUrl(state.resolvedUrl);
          } catch (cdnErr) {
            // Auto fallback to raw.githubusercontent.com if jsDelivr fails
            if (state.fallbackUrl && state.fallbackUrl !== state.resolvedUrl) {
              $('loader-text').textContent = 'Switching to GitHub Raw server...';
              state.resolvedUrl = state.fallbackUrl;
              pdfDoc = await loadUrl(state.fallbackUrl);
            } else {
              throw cdnErr;
            }
          }
        } else {
          state.currentPath = '';
          state.resolvedUrl = '';
          state.docKey = 'mpyq_local_' + (displayName || 'file');
          pdfDoc = await pdfjsLib.getDocument(source).promise;
        }

        state.pdfDoc = pdfDoc;
        state.numPages = pdfDoc.numPages;
        $('page-count').textContent = state.numPages;
        $('page-input').max = state.numPages;

        showReaderView();
        renderSidebarFiles();

        const saved = parseInt(localStorage.getItem(state.docKey + '_lastpage') || '1', 10);
        const initPage = Math.max(1, Math.min(state.numPages, startPage || saved || 1));
        state.currentPage = initPage;

        await computeScale();
        await buildPagePlaceholders();
        buildThumbnails();
        loadOutline();
        renderBookmarks();
        goToPage(initPage, false);

        showToast(`Loaded (${state.numPages} pages)`);
      } catch (err) {
        console.error(err);
        alert('PDF লোড করা যায়নি।\nনিশ্চিত করুন ফাইলটি Public GitHub repo-তে আছে।\nError: ' + (err.message || err));
      } finally {
        setLoading(false);
      }
    }

    async function computeScale() {
      if (!state.pdfDoc) return;
      const p1 = await state.pdfDoc.getPage(1);
      const vp = p1.getViewport({ scale: 1, rotation: state.rotation });
      const availW = viewerContainer.clientWidth - (state.viewMode === 'book' ? 60 : 36);
      const availH = viewerContainer.clientHeight - 36;

      if (state.zoomMode === 'fit-width') {
        const div = state.viewMode === 'book' ? 2 : 1;
        state.scale = Math.max(0.4, Math.min(2.8, (availW / div) / vp.width));
      } else if (state.zoomMode === 'fit-page') {
        state.scale = Math.max(0.4, Math.min(2.8, Math.min(availW / vp.width, availH / vp.height)));
      } else {
        state.scale = parseFloat(state.zoomMode) || 1.25;
      }
    }

    async function buildPagePlaceholders() {
      if (state.pageObserver) state.pageObserver.disconnect();
      state.renderedPages.clear();
      pagesWrapper.innerHTML = '';

      pagesWrapper.className = '';
      if (state.viewMode === 'book') pagesWrapper.classList.add('view-book');
      if (state.viewMode === 'single') pagesWrapper.classList.add('view-single');

      const p1 = await state.pdfDoc.getPage(1);
      const est = p1.getViewport({ scale: state.scale, rotation: state.rotation });
      const frag = document.createDocumentFragment();

      for (let i = 1; i <= state.numPages; i++) {
        const shell = document.createElement('div');
        shell.className = 'page-shell';
        shell.dataset.page = i;
        shell.style.width = `${Math.floor(est.width)}px`;
        shell.style.height = `${Math.floor(est.height)}px`;
        shell.innerHTML = `<canvas></canvas><div class="textLayer"></div><div class="page-badge">Page ${i}</div>`;
        frag.appendChild(shell);
      }
      pagesWrapper.appendChild(frag);

      state.pageObserver = new IntersectionObserver(
        (entries) => entries.forEach((en) => { if (en.isIntersecting) renderPage(+en.target.dataset.page); }),
        { root: viewerContainer, rootMargin: '600px 0px' }
      );
      document.querySelectorAll('.page-shell').forEach((el) => state.pageObserver.observe(el));
      if (state.viewMode === 'single') updateSinglePage();
    }

    async function renderPage(pageNum) {
      if (!state.pdfDoc || state.renderedPages.has(pageNum)) return;
      const shell = pagesWrapper.querySelector(`.page-shell[data-page="${pageNum}"]`);
      if (!shell) return;
      state.renderedPages.add(pageNum);

      try {
        const page = await state.pdfDoc.getPage(pageNum);
        const vp = page.getViewport({ scale: state.scale, rotation: state.rotation });
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

        shell.style.width = `${Math.floor(vp.width)}px`;
        shell.style.height = `${Math.floor(vp.height)}px`;

        const canvas = shell.querySelector('canvas');
        canvas.width = Math.floor(vp.width * dpr);
        canvas.height = Math.floor(vp.height * dpr);
        canvas.style.width = `${Math.floor(vp.width)}px`;
        canvas.style.height = `${Math.floor(vp.height)}px`;

        const task = page.render({
          canvasContext: canvas.getContext('2d', { alpha: false }),
          viewport: vp,
          transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
        });
        state.renderTasks.set(pageNum, task);
        await task.promise;
        state.renderTasks.delete(pageNum);

        const tl = shell.querySelector('.textLayer');
        tl.innerHTML = '';
        tl.style.width = `${Math.floor(vp.width)}px`;
        tl.style.height = `${Math.floor(vp.height)}px`;
        tl.style.setProperty('--scale-factor', vp.scale);

        const tc = await page.getTextContent();
        await pdfjsLib.renderTextLayer({ textContentSource: tc, container: tl, viewport: vp, textDivs: [] }).promise;
        if (state.searchQuery) applyHighlightsToPage(pageNum);
      } catch (e) {
        if (e?.name !== 'RenderingCancelledException') state.renderedPages.delete(pageNum);
      }
    }

    function buildThumbnails() {
      if (state.thumbObserver) state.thumbObserver.disconnect();
      const box = $('panel-thumbs');
      box.innerHTML = '';
      state.renderedThumbs.clear();
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= state.numPages; i++) {
        const c = document.createElement('div');
        c.className = 'thumb-card' + (i === state.currentPage ? ' active' : '');
        c.dataset.page = i;
        c.innerHTML = `<canvas width="140" height="190"></canvas><div class="thumb-label">Page ${i}</div>`;
        c.onclick = () => goToPage(i);
        frag.appendChild(c);
      }
      box.appendChild(frag);

      state.thumbObserver = new IntersectionObserver(
        (entries) => entries.forEach(async (en) => {
          if (!en.isIntersecting) return;
          const p = +en.target.dataset.page;
          if (state.renderedThumbs.has(p)) return;
          state.renderedThumbs.add(p);
          try {
            const page = await state.pdfDoc.getPage(p);
            const vp = page.getViewport({ scale: 0.25 });
            const cv = en.target.querySelector('canvas');
            cv.width = vp.width; cv.height = vp.height;
            await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
          } catch {}
        }),
        { root: box, rootMargin: '250px 0px' }
      );
      box.querySelectorAll('.thumb-card').forEach((el) => state.thumbObserver.observe(el));
    }

    async function loadOutline() {
      const panel = $('panel-outline');
      panel.innerHTML = '';
      try {
        const outline = await state.pdfDoc.getOutline();
        if (!outline?.length) {
          panel.innerHTML = '<p style="color:var(--text-muted);font-size:12.5px;">No Table of Contents in this PDF.</p>';
          return;
        }
        const addItems = (items, depth = 0) => items.forEach((it) => {
          const d = document.createElement('div');
          d.className = 'outline-item';
          d.style.paddingLeft = `${8 + depth * 14}px`;
          d.textContent = it.title;
          d.onclick = async () => {
            let dest = typeof it.dest === 'string' ? await state.pdfDoc.getDestination(it.dest) : it.dest;
            if (Array.isArray(dest) && dest[0]) goToPage((await state.pdfDoc.getPageIndex(dest[0])) + 1);
          };
          panel.appendChild(d);
          if (it.items?.length) addItems(it.items, depth + 1);
        });
        addItems(outline);
      } catch {}
    }

    function updateSinglePage() {
      document.querySelectorAll('.page-shell').forEach((el) =>
        el.classList.toggle('current-single', +el.dataset.page === state.currentPage)
      );
      renderPage(state.currentPage);
    }

    function syncPageUI(p) {
      state.currentPage = Math.max(1, Math.min(state.numPages || 1, p));
      $('page-input').value = state.currentPage;
      $('note-page-num').textContent = state.currentPage;
      $('reading-progress').style.width = `${state.numPages ? (state.currentPage / state.numPages) * 100 : 0}%`;
      document.querySelectorAll('.thumb-card.active').forEach((el) => el.classList.remove('active'));
      document.querySelector(`.thumb-card[data-page="${state.currentPage}"]`)?.classList.add('active');
      if (state.docKey) localStorage.setItem(state.docKey + '_lastpage', state.currentPage);
    }

    function goToPage(p, smooth = true) {
      if (!state.pdfDoc) return;
      p = Math.max(1, Math.min(state.numPages, p));
      syncPageUI(p);
      if (state.viewMode === 'single') { updateSinglePage(); viewerContainer.scrollTop = 0; return; }
      const target = pagesWrapper.querySelector(`.page-shell[data-page="${p}"]`);
      if (target) { renderPage(p); target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' }); }
    }
    window.goToPage = goToPage;

    let scrollT;
    viewerContainer.addEventListener('scroll', () => {
      if (!state.pdfDoc || document.body.classList.contains('mode-library') || state.viewMode === 'single') return;
      clearTimeout(scrollT);
      scrollT = setTimeout(() => {
        const mid = viewerContainer.scrollTop + viewerContainer.clientHeight * 0.35;
        for (const el of pagesWrapper.querySelectorAll('.page-shell')) {
          if (el.offsetTop + el.offsetHeight >= mid) { syncPageUI(+el.dataset.page); break; }
        }
      }, 60);
    });

    async function refreshLayout() {
      if (!state.pdfDoc) return;
      const keep = state.currentPage;
      state.renderTasks.forEach((t) => { try { t.cancel(); } catch {} });
      state.renderTasks.clear();
      await computeScale();
      await buildPagePlaceholders();
      goToPage(keep, false);
    }

    // In-PDF Search
    async function runSearch(q) {
      state.searchQuery = q.trim();
      state.searchMatches = [];
      state.activeMatchIdx = -1;
      $('search-results-list').innerHTML = '';
      document.querySelectorAll('.search-highlight').forEach((el) => el.classList.remove('search-highlight', 'current-match'));
      if (!state.pdfDoc || !state.searchQuery) {
        $('search-status').textContent = 'Type to search';
        $('search-counter').textContent = '';
        return;
      }
      if (state.pageTexts.length !== state.numPages) {
        $('search-status').textContent = 'Indexing pages...';
        state.pageTexts = [];
        for (let i = 1; i <= state.numPages; i++) {
          const tc = await (await state.pdfDoc.getPage(i)).getTextContent();
          state.pageTexts.push(tc.items.map((x) => x.str).join(' '));
        }
      }
      const ql = state.searchQuery.toLowerCase();
      state.pageTexts.forEach((txt, idx) => {
        const low = txt.toLowerCase();
        let pos = 0, occ = 0;
        while ((pos = low.indexOf(ql, pos)) !== -1) {
          state.searchMatches.push({
            page: idx + 1, occ,
            snippet: txt.slice(Math.max(0, pos - 30), Math.min(txt.length, pos + ql.length + 40))
          });
          pos += ql.length; occ++;
        }
      });
      if (!state.searchMatches.length) {
        $('search-status').textContent = 'No matches';
        $('search-counter').textContent = '0 / 0';
        return;
      }
      $('search-status').textContent = 'Matches found';
      const rx = new RegExp(`(${state.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      state.searchMatches.slice(0, 50).forEach((m, i) => {
        const d = document.createElement('div');
        d.className = 'search-item';
        d.dataset.idx = i;
        d.innerHTML = `<b>Page ${m.page}:</b> ...${escapeHtml(m.snippet).replace(rx, '<mark>$1</mark>')}...`;
        d.onclick = () => jumpMatch(i);
        $('search-results-list').appendChild(d);
      });
      state.renderedPages.forEach(applyHighlightsToPage);
      jumpMatch(0);
    }

    function applyHighlightsToPage(p) {
      if (!state.searchQuery) return;
      const ql = state.searchQuery.toLowerCase();
      pagesWrapper.querySelectorAll(`.page-shell[data-page="${p}"] .textLayer span`).forEach((sp) => {
        if (sp.textContent.toLowerCase().includes(ql)) sp.classList.add('search-highlight');
      });
    }

    async function jumpMatch(i) {
      if (!state.searchMatches.length) return;
      state.activeMatchIdx = (i + state.searchMatches.length) % state.searchMatches.length;
      const m = state.searchMatches[state.activeMatchIdx];
      $('search-counter').textContent = `${state.activeMatchIdx + 1} / ${state.searchMatches.length}`;
      document.querySelectorAll('.search-item.active').forEach((el) => el.classList.remove('active'));
      document.querySelector(`.search-item[data-idx="${state.activeMatchIdx}"]`)?.classList.add('active');
      goToPage(m.page);
      await renderPage(m.page);
      applyHighlightsToPage(m.page);
      document.querySelectorAll('.current-match').forEach((el) => el.classList.remove('current-match'));
      const spans = pagesWrapper.querySelectorAll(`.page-shell[data-page="${m.page}"] .search-highlight`);
      if (spans.length) {
        const sp = spans[Math.min(m.occ, spans.length - 1)];
        sp.classList.add('current-match');
        sp.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Bookmarks & Notes
    const getBMs = () => { try { return JSON.parse(localStorage.getItem(state.docKey + '_bm') || '[]'); } catch { return []; } };
    function renderBookmarks() {
      const box = $('bookmarks-list');
      const list = getBMs();
      if (!list.length) { box.innerHTML = '<p style="color:var(--text-muted);font-size:12.5px;">No bookmarks yet.</p>'; return; }
      box.innerHTML = list.map((b) => `
        <div class="bookmark-item">
          <div class="bookmark-head">
            <span class="bookmark-link" onclick="goToPage(${b.page})">Page ${b.page}</span>
            <button class="bookmark-del" onclick="deleteBM(${b.id})">✕</button>
          </div>
          <div>${escapeHtml(b.note)}</div>
        </div>
      `).join('');
    }
    function addBookmark(note = '') {
      if (!state.pdfDoc) return;
      const list = getBMs();
      list.unshift({ id: Date.now(), page: state.currentPage, note: note.trim() || `Page ${state.currentPage}` });
      localStorage.setItem(state.docKey + '_bm', JSON.stringify(list));
      renderBookmarks();
      showToast(`Bookmarked Page ${state.currentPage}`);
    }
    window.deleteBM = (id) => {
      localStorage.setItem(state.docKey + '_bm', JSON.stringify(getBMs().filter((x) => x.id !== id)));
      renderBookmarks();
    };

    // Read Aloud (TTS)
    function stopTTS() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.ttsActive = false;
      $('tts-play').textContent = 'Play';
      $('tts-status').textContent = `🔊 Ready (Page ${state.currentPage})`;
    }
    async function startTTS() {
      if (!state.pdfDoc || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const tc = await (await state.pdfDoc.getPage(state.currentPage)).getTextContent();
      const text = tc.items.map((x) => x.str).join(' ').trim();
      if (!text) return showToast('No readable text on this page');
      const u = new SpeechSynthesisUtterance(text);
      u.rate = parseFloat($('tts-rate').value) || 1;
      u.onstart = () => { state.ttsActive = true; $('tts-play').textContent = 'Pause'; $('tts-status').textContent = `🔊 Reading Page ${state.currentPage}`; };
      u.onend = stopTTS;
      window.speechSynthesis.speak(u);
    }

    // =========================================================================
    // BLOGGER EMBED GENERATOR (Single PDF / Subject Folder / Full Library)
    // =========================================================================
    function openEmbedModal(type, targetPath = '') {
      $('embed-type').value = type;
      if (type === 'pdf') $('embed-pdf-path').value = targetPath || state.currentPath || state.resolvedUrl || '';
      if (type === 'folder') $('embed-folder-path').value = targetPath || state.currentFolder || '';
      updateEmbedCode();
      $('embed-modal').classList.add('open');
    }

    function updateEmbedCode() {
      const type = $('embed-type').value;
      $('embed-target-pdf-wrap').style.display = type === 'pdf' ? 'flex' : 'none';
      $('embed-target-folder-wrap').style.display = type === 'folder' ? 'flex' : 'none';

      const base = window.location.protocol.startsWith('http')
        ? window.location.href.split('?')[0]
        : REPO.readerBase;

      const params = new URLSearchParams();
      if (type === 'pdf') {
        const p = $('embed-pdf-path').value.trim();
        if (p) params.set('file', normalizePdfInput(p).relPath || p);
      } else if (type === 'folder') {
        const f = $('embed-folder-path').value.trim().replace(/^\/+|\/+$/g, '');
        if (f) params.set('folder', f);
      }

      if ($('embed-theme').value !== 'dark') params.set('theme', $('embed-theme').value);
      if ($('embed-compact').checked) params.set('embed', 'true');
      if (!$('embed-download').checked) params.set('download', '0');
      if ($('embed-pdfdark').checked) params.set('pdfDark', '1');

      const src = params.toString() ? `${base}?${params.toString()}` : base;
      const h = $('embed-height').value.trim() || '760px';

      $('embed-output').value = `<!-- Madhyamik PYQ PDF Embed -->
<div style="width:100%; max-width:100%; margin:16px 0; border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,0.18);">
  <iframe
    src="${src}"
    width="100%"
    height="${h}"
    style="border:none; display:block;"
    allowfullscreen
    loading="lazy"
    title="Madhyamik PYQ PDF Reader">
  </iframe>
</div>`;
      $('embed-output').dataset.previewUrl = src;
    }

    // Event Bindings
    $('btn-sidebar').onclick = () => $('sidebar').classList.toggle('collapsed');
    document.querySelectorAll('.sidebar-tab').forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll('.sidebar-tab, .sidebar-panel').forEach((el) => el.classList.remove('active'));
        tab.classList.add('active');
        $('panel-' + tab.dataset.tab).classList.add('active');
      };
    });

    $('btn-home').onclick = () => { if (!document.body.classList.contains('single-embed')) showLibraryView(state.lockedRootFolder); };
    $('btn-back-lib').onclick = () => showLibraryView(state.currentFolder || state.lockedRootFolder);
    $('btn-refresh-repo').onclick = () => { fetchRepoTree(true); showToast('Refreshing GitHub folders...'); };
    $('lib-search-input').oninput = renderLibrary;
    $('sb-file-search').oninput = renderSidebarFiles;

    $('btn-prev').onclick = () => goToPage(state.currentPage - 1);
    $('btn-next').onclick = () => goToPage(state.currentPage + 1);
    $('page-input').onchange = (e) => goToPage(+e.target.value || 1);
    $('zoom-select').onchange = (e) => { state.zoomMode = e.target.value; refreshLayout(); };
    $('btn-zoom-in').onclick = () => { state.scale = Math.min(3, +(state.scale + 0.25).toFixed(2)); state.zoomMode = String(state.scale); refreshLayout(); };
    $('btn-zoom-out').onclick = () => { state.scale = Math.max(0.5, +(state.scale - 0.25).toFixed(2)); state.zoomMode = String(state.scale); refreshLayout(); };
    $('view-mode').onchange = (e) => { state.viewMode = e.target.value; refreshLayout(); };
    $('btn-rotate').onclick = () => { state.rotation = (state.rotation + 90) % 360; refreshLayout(); };
    $('btn-pdf-dark').onclick = () => { document.body.classList.toggle('pdf-dark-mode'); $('btn-pdf-dark').classList.toggle('active'); };
    $('theme-select').onchange = (e) => document.documentElement.setAttribute('data-theme', e.target.value);
    $('btn-fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.();
    $('btn-bookmark').onclick = () => addBookmark();
    $('btn-save-note').onclick = () => { addBookmark($('note-input').value); $('note-input').value = ''; };

    $('btn-download').onclick = () => {
      if (!state.resolvedUrl) return;
      const a = document.createElement('a');
      a.href = state.fallbackUrl || state.resolvedUrl;
      a.target = '_blank';
      a.download = (state.currentPath || state.resolvedUrl).split('/').pop() || 'document.pdf';
      a.click();
    };

    $('btn-search').onclick = () => { $('search-bar').classList.toggle('open'); if ($('search-bar').classList.contains('open')) $('search-input').focus(); };
    $('search-close').onclick = () => $('search-bar').classList.remove('open');
    let sDeb;
    $('search-input').oninput = (e) => { clearTimeout(sDeb); sDeb = setTimeout(() => runSearch(e.target.value), 300); };
    $('search-input').onkeydown = (e) => { if (e.key === 'Enter') jumpMatch(state.activeMatchIdx + (e.shiftKey ? -1 : 1)); };
    $('search-next').onclick = () => jumpMatch(state.activeMatchIdx + 1);
    $('search-prev').onclick = () => jumpMatch(state.activeMatchIdx - 1);

    $('btn-tts').onclick = () => { $('tts-bar').classList.toggle('open'); $('tts-status').textContent = `🔊 Ready (Page ${state.currentPage})`; };
    $('tts-close').onclick = () => { stopTTS(); $('tts-bar').classList.remove('open'); };
    $('tts-stop').onclick = stopTTS;
    $('tts-play').onclick = () => {
      if (state.ttsActive && window.speechSynthesis.speaking) {
        if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); $('tts-play').textContent = 'Pause'; }
        else { window.speechSynthesis.pause(); $('tts-play').textContent = 'Resume'; }
      } else startTTS();
    };

    // Modals
    document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => $(b.dataset.close).classList.remove('open'));
    document.querySelectorAll('.modal-backdrop').forEach((bg) => bg.onclick = (e) => { if (e.target === bg) bg.classList.remove('open'); });

    $('btn-open-modal').onclick = () => $('open-modal').classList.add('open');
    $('btn-modal-load').onclick = () => {
      const u = $('modal-pdf-url').value.trim();
      if (!u) return showToast('Enter a PDF URL');
      $('open-modal').classList.remove('open');
      loadPDF(u);
    };
    $('btn-modal-local').onclick = () => { $('open-modal').classList.remove('open'); $('file-input').click(); };
    $('file-input').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => loadPDF({ data: new Uint8Array(r.result) }, { displayName: f.name });
      r.readAsArrayBuffer(f);
    };

    $('btn-embed-modal').onclick = () => {
      if (!document.body.classList.contains('mode-library') && (state.currentPath || state.resolvedUrl)) {
        openEmbedModal('pdf', state.currentPath || state.resolvedUrl);
      } else if (state.currentFolder) {
        openEmbedModal('folder', state.currentFolder);
      } else {
        openEmbedModal('library');
      }
    };
    $('btn-embed-folder').onclick = () => openEmbedModal(state.currentFolder ? 'folder' : 'library', state.currentFolder);

    ['embed-type', 'embed-pdf-path', 'embed-folder-path', 'embed-theme', 'embed-height', 'embed-compact', 'embed-download', 'embed-pdfdark']
      .forEach((id) => $(id).addEventListener('input', updateEmbedCode));

    $('btn-copy-embed').onclick = () => {
      navigator.clipboard.writeText($('embed-output').value);
      showToast('Blogger Embed HTML copied!');
    };
    $('btn-test-embed').onclick = () => {
      const u = $('embed-output').dataset.previewUrl;
      if (u) window.open(u, '_blank');
    };

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement?.tagName;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && !document.body.classList.contains('mode-library')) {
        e.preventDefault(); $('search-bar').classList.add('open'); $('search-input').focus(); return;
      }
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === 'ArrowRight') goToPage(state.currentPage + 1);
      else if (e.key === 'ArrowLeft') goToPage(state.currentPage - 1);
      else if (e.key === '+' || e.key === '=') $('btn-zoom-in').click();
      else if (e.key === '-') $('btn-zoom-out').click();
      else if (e.key.toLowerCase() === 'r') $('btn-rotate').click();
      else if (e.key.toLowerCase() === 'f') $('btn-fullscreen').click();
      else if (e.key.toLowerCase() === 'b') addBookmark();
    });

    let rzT;
    window.addEventListener('resize', () => {
      if (!document.body.classList.contains('mode-library') && (state.zoomMode === 'fit-width' || state.zoomMode === 'fit-page')) {
        clearTimeout(rzT); rzT = setTimeout(refreshLayout, 250);
      }
    });

    // Boot App
    (async function init() {
      const p = new URLSearchParams(window.location.search);
      const file = p.get('file');
      const folder = (p.get('folder') || '').replace(/^\/+|\/+$/g, '');
      const theme = p.get('theme');
      const embed = p.get('embed');
      const dl = p.get('download');
      const pdfDark = p.get('pdfDark');
      const page = parseInt(p.get('page') || '', 10) || null;
      const view = p.get('view');

      if (theme && ['dark', 'light', 'sepia'].includes(theme)) {
        document.documentElement.setAttribute('data-theme', theme);
        $('theme-select').value = theme;
      }
      if (embed === 'true' || embed === '1') document.body.classList.add('embed-mode');
      if (dl === '0' || dl === 'false') document.body.classList.add('no-download');
      if (pdfDark === '1' || pdfDark === 'true') {
        document.body.classList.add('pdf-dark-mode');
        $('btn-pdf-dark').classList.add('active');
      }
      if (view && ['continuous', 'single', 'book'].includes(view)) {
        state.viewMode = view;
        $('view-mode').value = view;
      }

      if (folder) {
        state.currentFolder = folder;
        if (embed === 'true' || embed === '1') state.lockedRootFolder = folder;
      }

      // If embedded for a single PDF, hide library buttons for super clean look
      if (file && (embed === 'true' || embed === '1')) {
        document.body.classList.add('single-embed');
        document.querySelector('[data-tab="thumbs"]').click();
        loadPDF(file, { startPage: page });
        return;
      }

      // Load full repository folder/subfolder tree automatically
      await fetchRepoTree();

      if (file) {
        loadPDF(file, { startPage: page });
      }
    })();
  </script>
</body>
</html>
